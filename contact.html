<!DOCTYPE html>
<html>
  <!-- header information -->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1" />
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="/assets/css/main.css"/>
    <link rel="stylesheet" type="text/css" href="/assets/css/nav.css"/>

    <!-- Font Awesome 4 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Lewis de Zoete Grundy</title>
  </head>

  <!-- Content -->
  <body data-page="contact">
    <!-- Nav bar -->
    <div id="nav"></div>

    <!-- Main -->
    <main class="page">
      <h1>Socials</h1>
      <ul style="list-style-type:none;" class="icons">
        <li><a href="https://www.linkedin.com/in/lewis-de-zoete-grundy-1093b3160/" class="fa fa-linkedin"><span class="label">  LinkedIn</span></a></li>
        <li><a href="https://github.com/LewisDeZoete" class="fa fa-github"><span class="label">  GitHub</span></a></li>
      </ul>

      <!-- TODO: Contact form - https://www.w3schools.com/howto/howto_css_contact_form.asp -->
      <h1 class="major">Contact</h1>
      <form method="post" action="#">
      <div class="fields">
          <div class="field half">
          <label for="name">Name</label>
          <input type="text" name="name" id="name" />
          </div>
          <div class="field half">
          <label for="email">Email</label>
          <input type="text" name="email" id="email" />
          </div>
          <div class="field">
          <label for="message">Message</label>
          <textarea name="message" id="message" rows="4"></textarea>
          </div>
      </div>
      <ul style="list-style-type:none;" class="actions" >
          <li><input type="submit" value="Send Message" class="primary" /></li>
          <li><input type="reset" value="Reset" /></li>
      </ul>
      </form>
    </main>

    <!-- Scripts -->
    <script src="/assets/js/nav.js"></script>
  </body>
</html>
